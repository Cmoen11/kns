name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Releases are numbered in push order: a run waits for the one before it (a newer push replaces a
# run that is still waiting, and its release then carries both pushes).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Which version this run builds, and whether it releases it (docs/auto-update.md):
  # - a push to main releases the next patch after the newest v* tag, or package.json's version
  #   when that is higher (bump it there for a minor or major release);
  # - a v* tag releases that version (the tag must match package.json);
  # - a manual run builds package.json's version and releases nothing.
  # A commit that already carries a version tag (a re-run) is not released again.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          pkg=$(jq -r .version package.json)
          newer() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" = "$1" ]; }
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"; release=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            tagged=$(git tag --points-at HEAD -l 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -V | tail -1)
            latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -V | tail -1)
            if [ -n "$tagged" ]; then
              version=$tagged; release=false
            elif [ -z "$latest" ] || newer "$pkg" "$latest"; then
              version=$pkg; release=true
            else
              IFS=. read -r major minor patch <<<"$latest"
              version="$major.$minor.$((patch + 1))"; release=true
            fi
          else
            version=$pkg; release=false
          fi
          echo "version $version, release $release"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  # Tests and lints, in parallel with the release build (build) so a run waits for the longer of
  # the two, not both; release needs both. macOS compiles the unix/AppKit paths, Windows its own.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # the Herdr mod's pure modules (herdr/app/kns): no Herdr runtime needed
      - run: node --test herdr/app/kns/mod.test.mjs
      # Rust checks (debug build: uses devUrl, no dist needed)
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # the app carries the version it is released as: the updater compares it with latest.json
      - name: set version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: node -e 'const f="package.json",p=JSON.parse(require("fs").readFileSync(f));p.version=process.env.VERSION;require("fs").writeFileSync(f,JSON.stringify(p,null,2)+"\n")'
      # a release tag must match the app version and the app must carry the updater public key,
      # or installed apps would loop on (or never verify) the update (docs/auto-update.md)
      - name: check release
        if: needs.version.outputs.release == 'true'
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=$(git show HEAD:package.json | jq -r .version)
            test "$GITHUB_REF_NAME" = "v$version" || { echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }
          fi
          test -n "$(jq -r '.plugins.updater.pubkey // ""' src-tauri/tauri.conf.json)" || { echo "::error::plugins.updater.pubkey is empty in tauri.conf.json"; exit 1; }
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # Updater bundles (.sig, macOS .app.tar.gz) need the signing key; without it (forks) the
      # build still runs but cannot be released.
      # macOS code signing and notarization (Developer ID). tauri build imports APPLE_CERTIFICATE
      # (base64 .p12) into a temporary keychain, signs the .app with the hardened runtime,
      # notarizes and staples it, then builds the .dmg and the updater .app.tar.gz from the signed
      # app. Notarization takes an Apple ID (APPLE_ID, APPLE_PASSWORD = app-specific password,
      # APPLE_TEAM_ID) or an App Store Connect API key (APPLE_API_ISSUER, APPLE_API_KEY and the
      # .p8 contents in APPLE_API_PRIVATE_KEY). Only the macOS job gets these secrets.
      - name: tauri build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE: ${{ needs.version.outputs.release }}
          IS_MAC: ${{ matrix.os == 'macos-latest' }}
          APPLE_CERTIFICATE: ${{ matrix.os == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.os == 'macos-latest' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ matrix.os == 'macos-latest' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_PRIVATE_KEY: ${{ matrix.os == 'macos-latest' && secrets.APPLE_API_PRIVATE_KEY || '' }}
        run: |
          set -euo pipefail
          extra=()
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            extra=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          elif [ "$RELEASE" = true ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set: a release must carry updater signatures"
            exit 1
          fi
          if [ "$IS_MAC" = true ]; then
            # empty variables would make tauri try to sign or notarize with nothing: drop them
            # (the certificate password may be empty)
            for v in APPLE_CERTIFICATE APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY; do
              [ -n "${!v}" ] || unset "$v"
            done
            if [ -n "$APPLE_API_PRIVATE_KEY" ]; then
              key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY:-kns}.p8"
              printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key"
              export APPLE_API_KEY_PATH="$key"
            fi
            unset APPLE_API_PRIVATE_KEY
            if [ -z "${APPLE_CERTIFICATE:-}" ]; then
              if [ "$RELEASE" = true ]; then
                echo "::error::APPLE_CERTIFICATE is not set: a release must be signed with the Developer ID certificate"
                exit 1
              fi
              echo "::warning::APPLE_CERTIFICATE is not set: the macOS build is not signed"
            elif [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
              echo "signing and notarizing with Apple ID"; echo "MAC_NOTARIZED=true" >> "$GITHUB_ENV"
            elif [ -n "${APPLE_API_ISSUER:-}" ] && [ -n "${APPLE_API_KEY:-}" ] && [ -n "${APPLE_API_KEY_PATH:-}" ]; then
              echo "signing and notarizing with App Store Connect API key"; echo "MAC_NOTARIZED=true" >> "$GITHUB_ENV"
            elif [ "$RELEASE" = true ]; then
              echo "::error::notarization secrets are missing: set APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID (or APPLE_API_ISSUER, APPLE_API_KEY and APPLE_API_PRIVATE_KEY)"
              exit 1
            else
              echo "::warning::notarization secrets are missing: the macOS build is signed but not notarized"
            fi
          fi
          pnpm tauri build ${{ matrix.args }} ${extra[@]+"${extra[@]}"}
      # a notarized build must pass Gatekeeper; this catches a missing signature or ticket
      - name: check macOS signature
        if: env.MAC_NOTARIZED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          app=$(ls -d src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier|Runtime)'
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
      - uses: actions/upload-artifact@v4
        with:
          name: kns-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -R dist
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        # upload-artifact roots at the common ancestor of its paths, so the files may be nested under dist.
        # latest.json is the updater feed: installed apps read releases/latest/download/latest.json
        # (plugins.updater.endpoints in tauri.conf.json) and verify each bundle against its .sig.
        run: |
          set -euo pipefail
          one() { mapfile -t f < <(find dist -type f -name "$1"); test "${#f[@]}" -eq 1 || { echo "::error::expected one $1, found ${#f[@]}" >&2; exit 1; }; echo "${f[0]}"; }
          version="$VERSION"
          tag="v$version"
          exe=$(one '*-setup.exe'); exe_sig=$(one '*-setup.exe.sig'); dmg=$(one '*.dmg')
          # the macOS bundle is named kns.app.tar.gz; give it the version and arch like the others
          app="dist/kns_${version}_aarch64.app.tar.gz"
          app_src=$(one '*.app.tar.gz'); app_sig=$(one '*.app.tar.gz.sig')
          mv "$app_src" "$app"; mv "$app_sig" "$app.sig"
          # on a push to main this also creates the tag, at the commit that was built
          gh release create "$tag" "$exe" "$dmg" "$app" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" --generate-notes
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          notes=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body -q .body)
          jq -n --arg v "$version" --arg notes "$notes" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg win_url "$base/$(basename "$exe")" --rawfile win_sig "$exe_sig" \
            --arg mac_url "$base/$(basename "$app")" --rawfile mac_sig "$app.sig" \
            '{version: $v, notes: $notes, pub_date: $date, platforms: {
               "windows-x86_64": {url: $win_url, signature: ($win_sig | rtrimstr("\n"))},
               "darwin-aarch64": {url: $mac_url, signature: ($mac_sig | rtrimstr("\n"))}}}' > dist/latest.json
          cat dist/latest.json
          gh release upload "$tag" dist/latest.json --repo "$GITHUB_REPOSITORY"

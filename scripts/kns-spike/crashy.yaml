# :why / crash card / trap: CrashLoopBackOff, exit code 1 after 3 s, a last log line on stderr
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashy
spec:
  replicas: 1
  selector:
    matchLabels: { app: crashy }
  template:
    metadata:
      labels: { app: crashy }
    spec:
      containers:
        - name: crashy
          image: busybox:1.37.0
          command: ["sh", "-c", "echo starting; sleep 3; echo 'fatal: config missing' >&2; exit 1"]
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 16Mi }
